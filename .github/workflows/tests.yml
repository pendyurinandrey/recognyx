name: Tests

on:
  push:
  workflow_dispatch:  # ручной запуск: вкладка Actions -> Tests -> Run workflow

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 — минимальная поддерживаемая версия (requires-python в pyproject.toml)
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # uv сам скачивает нужный Python (поверх .python-version из репозитория)
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Только группа dev (pytest), без самого проекта и его зависимостей: тяжёлые
      # GigaAM, torch, PySide6 тестам не нужны. Пакеты проекта импортируются через
      # pythonpath = ["."] в настройках pytest. --locked: uv.lock должен быть актуален.
      - name: Install
        run: uv sync --locked --only-group dev

      # -rs печатает причины пропущенных тестов. Пропусков быть не должно: тестам не нужны
      # ни gigaam, ни torch (тяжёлые импорты — только внутри функций процессов-исполнителей).
      - name: Run tests
        run: uv run --no-sync python -m pytest -rs
