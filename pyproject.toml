[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "recognyx"
version = "0.1.0"
# Верхняя граница: gigaam требует onnxruntime 1.23, а для него нет сборок под Python 3.14
requires-python = ">=3.12,<3.14"
# Окружение для графического интерфейса: fork_join (stdlib) + transcription (GigaAM) и diarization
# (gigaam[longform] приносит torch и pyannote.audio) + wakepy и PySide6 для самого GUI.
dependencies = [
    "gigaam[torch,longform]",
    "certifi",
    "wakepy",
    "PySide6",
]

[project.scripts]
# Команда `recognyx` запускает графический интерфейс (то же, что `python -m recognyx`)
recognyx = "recognyx.__main__:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
gigaam = { git = "https://github.com/salute-developers/GigaAM.git" }

[tool.setuptools.packages.find]
include = ["recognyx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# importlib: тесты в разных папках могут называться одинаково (tests/common/test_x.py и
# tests/diarization/test_x.py) и не требуют __init__.py в tests/
addopts = ["--import-mode=importlib"]
